name: Component release

on:
  push:
    tags:
      - server-mcp-v*
      - server-recompcatalog-v*
      - launcher-mqtt-v*
      - server-quake3-v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing component tag to recover after a workflow startup failure
        required: true
        type: string
      artifact_run_id:
        description: Prior successful build run ID; set when reusing checked release artifact bytes
        required: false
        type: string
      artifact_run_attempt:
        description: Attempt number for the prior build run
        required: false
        default: '1'
        type: string

permissions:
  actions: read
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plugin: ${{ steps.selection.outputs.plugin }}
      tag: ${{ steps.selection.outputs.tag }}
      artifact_run_id: ${{ steps.selection.outputs.artifact_run_id }}
      artifact_run_attempt: ${{ steps.selection.outputs.artifact_run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Validate exact tag, component version, and reviewed commit
        id: selection
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          TAG_COMMIT: ${{ github.sha }}
          RUN_EVENT: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_RUN_ATTEMPT: ${{ inputs.artifact_run_attempt || '1' }}
        run: |
          $selection = (./eng/Resolve-ReleaseSelection.ps1 -Tag $env:RELEASE_TAG | ConvertFrom-Json)[0]
          $checkedOut = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-parse "$($env:RELEASE_TAG)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'The selected component tag does not resolve to a commit.' }
          if ($env:RUN_EVENT -eq 'push') {
            if ($checkedOut -cne $env:TAG_COMMIT -or $tagCommit -cne $env:TAG_COMMIT) {
              throw 'The checked-out source does not match the pushed tag commit.'
            }
          }
          elseif ($env:RUN_EVENT -eq 'workflow_dispatch') {
            if ($env:RUN_REF -cne 'refs/heads/main') {
              throw 'Release recovery dispatches must run from the main branch.'
            }
            if ($env:ARTIFACT_RUN_ID -and $env:ARTIFACT_RUN_ID -notmatch '^[1-9][0-9]*$') {
              throw 'Artifact run ID must be a positive numeric workflow run ID.'
            }
            if ($env:ARTIFACT_RUN_ATTEMPT -notmatch '^[1-9][0-9]*$') {
              throw 'Artifact run attempt must be a positive number.'
            }
            if ($env:ARTIFACT_RUN_ID) {
              Import-Module ./eng/PluginRelease.psm1 -Force
              $component = @(Get-PluginRegistry | Where-Object key -CEQ $selection.key)[0]
              if ($component.artifactFormat -cne 'nupkg') {
                throw 'Prior-run artifact reuse is supported only for validated NuGet package releases.'
              }
            }
          }
          else {
            throw "Unsupported component release event '$($env:RUN_EVENT)'."
          }
          git fetch origin main --tags
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the reviewed main branch.' }
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit already reachable from main.' }
          "plugin=$($selection.key)" >> $env:GITHUB_OUTPUT
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "artifact_run_id=$env:ARTIFACT_RUN_ID" >> $env:GITHUB_OUTPUT
          "artifact_run_attempt=$env:ARTIFACT_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT

  server-mcp:
    needs: plan
    if: needs.plan.outputs.plugin == 'Server.Mcp'
    concurrency:
      group: release-server-mcp
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      packages: write
    uses: ./.github/workflows/release-plugin.yml
    with:
      plugin: Server.Mcp
      tag: ${{ needs.plan.outputs.tag }}
      artifact_run_id: ${{ needs.plan.outputs.artifact_run_id }}
      artifact_run_attempt: ${{ needs.plan.outputs.artifact_run_attempt }}
    secrets:
      nuget_api_key: ${{ secrets.NUGET_API_KEY }}

  server-quake3:
    needs: plan
    if: needs.plan.outputs.plugin == 'Server.Quake3'
    permissions:
      actions: read
      contents: write
      packages: write
    uses: ./.github/workflows/release-plugin.yml
    with:
      plugin: Server.Quake3
      tag: ${{ needs.plan.outputs.tag }}
      artifact_run_id: ${{ needs.plan.outputs.artifact_run_id }}
      artifact_run_attempt: ${{ needs.plan.outputs.artifact_run_attempt }}
    secrets:
      nuget_api_key: ${{ secrets.NUGET_API_KEY }}

  server-recompcatalog:
    needs: plan
    if: needs.plan.outputs.plugin == 'Server.RecompCatalog'
    concurrency:
      group: release-server-recompcatalog
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      packages: write
    uses: ./.github/workflows/release-plugin.yml
    with:
      plugin: Server.RecompCatalog
      tag: ${{ needs.plan.outputs.tag }}
      artifact_run_id: ${{ needs.plan.outputs.artifact_run_id }}
      artifact_run_attempt: ${{ needs.plan.outputs.artifact_run_attempt }}
    secrets:
      nuget_api_key: ${{ secrets.NUGET_API_KEY }}

  launcher-mqtt:
    needs: plan
    if: needs.plan.outputs.plugin == 'Launcher.MQTT'
    concurrency:
      group: release-launcher-mqtt
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      # The caller grants the reusable workflow ceiling; child job permissions are scoped below.
      packages: write
    uses: ./.github/workflows/release-plugin.yml
    with:
      plugin: Launcher.MQTT
      tag: ${{ needs.plan.outputs.tag }}
      artifact_run_id: ${{ needs.plan.outputs.artifact_run_id }}
      artifact_run_attempt: ${{ needs.plan.outputs.artifact_run_attempt }}
