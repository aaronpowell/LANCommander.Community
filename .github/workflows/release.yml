name: Component release

on:
  push:
    tags:
      - server-mcp-v*
      - server-recompcatalog-v*
      - launcher-mqtt-v*
      - server-quake3-v*

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.selection.outputs.plugin }}
      tag: ${{ steps.selection.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Validate exact tag, component version, and reviewed commit
        id: selection
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_COMMIT: ${{ github.sha }}
        run: |
          $selection = (./eng/Resolve-ReleaseSelection.ps1 -Tag $env:RELEASE_TAG | ConvertFrom-Json)[0]
          $checkedOut = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-parse "$($env:RELEASE_TAG)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $checkedOut -cne $env:TAG_COMMIT -or $tagCommit -cne $env:TAG_COMMIT) {
            throw 'The checked-out source does not match the pushed tag commit.'
          }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the reviewed main branch.' }
          git merge-base --is-ancestor $env:TAG_COMMIT origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit already reachable from main.' }
          "plugin=$($selection.key)" >> $env:GITHUB_OUTPUT
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT

  server-mcp:
    needs: plan
    if: needs.plan.outputs.plugin == 'Server.Mcp'
    concurrency:
      group: release-server-mcp
      cancel-in-progress: false
    permissions:
      contents: write
    uses: ./.github/workflows/release-plugin.yml
    with:
      plugin: Server.Mcp
      tag: ${{ needs.plan.outputs.tag }}

  server-quake3:
    needs: plan
    if: needs.plan.outputs.plugin == 'Server.Quake3'
    permissions:
      contents: write
    uses: ./.github/workflows/release-plugin.yml
    with:
      plugin: Server.Quake3
      tag: ${{ needs.plan.outputs.tag }}

  server-recompcatalog:
    needs: plan
    if: needs.plan.outputs.plugin == 'Server.RecompCatalog'
    concurrency:
      group: release-server-recompcatalog
      cancel-in-progress: false
    permissions:
      contents: write
    uses: ./.github/workflows/release-plugin.yml
    with:
      plugin: Server.RecompCatalog
      tag: ${{ needs.plan.outputs.tag }}

  launcher-mqtt:
    needs: plan
    if: needs.plan.outputs.plugin == 'Launcher.MQTT'
    concurrency:
      group: release-launcher-mqtt
      cancel-in-progress: false
    permissions:
      contents: write
    uses: ./.github/workflows/release-plugin.yml
    with:
      plugin: Launcher.MQTT
      tag: ${{ needs.plan.outputs.tag }}
