name: Publish existing release to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing, published server component tag (for example server-mcp-v0.2.1)
        required: true
        type: string
      publish:
        description: Confirm publication to GitHub Packages
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.selection.outputs.plugin }}
      tag: ${{ steps.selection.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: main
      - name: Validate release, package eligibility, and merged source
        id: selection
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          if ($env:WORKFLOW_REF -cne 'refs/heads/main') {
            throw 'GitHub Packages publication must be dispatched from the reviewed main branch.'
          }
          Import-Module ./eng/PluginRelease.psm1 -Force
          $selection = (./eng/Resolve-ReleaseSelection.ps1 -Tag $env:RELEASE_TAG | ConvertFrom-Json)[0]
          $component = @(Get-PluginRegistry | Where-Object key -CEQ $selection.key)[0]
          if ($component.artifactFormat -cne 'nupkg' -or $component.githubPackagesEligible -ne $true) {
            throw "$($component.key) does not produce a GitHub Packages-eligible NuGet package."
          }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the reviewed main branch.' }
          $tagCommit = (git rev-parse "$($env:RELEASE_TAG)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Release tag '$($env:RELEASE_TAG)' does not resolve to a commit." }
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The release tag must point to a commit already reachable from main.' }
          $releaseOutput = & gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --json isDraft,assets 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Could not read the GitHub Release: $($releaseOutput -join "`n")" }
          $release = ($releaseOutput -join "`n") | ConvertFrom-Json
          if ($release.isDraft) { throw 'GitHub Packages publication requires an already-published GitHub Release.' }
          $packageAsset = "$($component.packageId).$($selection.version).nupkg"
          $expectedAssets = @($packageAsset, "$packageAsset.sha256", 'release-manifest.json')
          $actualAssets = @($release.assets | ForEach-Object name)
          if ($actualAssets.Count -ne 3 -or @(Compare-Object $expectedAssets $actualAssets).Count -gt 0) {
            throw 'The published GitHub Release does not contain exactly the expected package, checksum, and manifest assets.'
          }
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'github-packages'
          New-Item -ItemType Directory -Path $artifactDirectory | Out-Null
          & gh release download $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --dir $artifactDirectory --pattern $packageAsset --pattern "$packageAsset.sha256" --pattern release-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the exact published GitHub Release assets.' }
          $manifest = Get-Content -LiteralPath (Join-Path $artifactDirectory 'release-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.sourceCommit -cne $tagCommit) { throw 'Release manifest does not match the exact release tag commit.' }
          ./eng/Publish-GitHubPackage.ps1 -Plugin $component.key -Tag $env:RELEASE_TAG -ArtifactDirectory $artifactDirectory -Owner $env:GITHUB_REPOSITORY_OWNER -Repository $env:RELEASE_REPOSITORY -PlanOnly
          "plugin=$($component.key)" >> $env:GITHUB_OUTPUT
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT

  publish:
    needs: plan
    if: inputs.publish == true && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: github-packages-${{ needs.plan.outputs.plugin }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Download the exact published GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_PLUGIN: ${{ needs.plan.outputs.plugin }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          Import-Module ./eng/PluginRelease.psm1 -Force
          $component = @(Get-PluginRegistry | Where-Object key -CEQ $env:RELEASE_PLUGIN)[0]
          $selection = (./eng/Resolve-ReleaseSelection.ps1 -Tag $env:RELEASE_TAG | ConvertFrom-Json)[0]
          $packageAsset = "$($component.packageId).$($selection.version).nupkg"
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'github-packages'
          New-Item -ItemType Directory -Path $artifactDirectory | Out-Null
          & gh release download $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --dir $artifactDirectory --pattern $packageAsset --pattern "$packageAsset.sha256" --pattern release-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the exact published GitHub Release assets.' }
      - name: Publish or verify the exact immutable package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_PLUGIN: ${{ needs.plan.outputs.plugin }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_ACTIONS: 'true'
          GITHUB_REF: ${{ github.ref }}
        run: ./eng/Publish-GitHubPackage.ps1 -Plugin $env:RELEASE_PLUGIN -Tag $env:RELEASE_TAG -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'github-packages') -Owner $env:GITHUB_REPOSITORY_OWNER -Repository $env:RELEASE_REPOSITORY -Publish
