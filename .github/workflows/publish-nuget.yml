name: Publish existing release to NuGet.org

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing, published component tag (for example server-mcp-v0.2.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.selection.outputs.plugin }}
      tag: ${{ steps.selection.outputs.tag }}
      package_asset: ${{ steps.selection.outputs.package_asset }}
      environment_ready: ${{ steps.selection.outputs.environment_ready }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: main
      - name: Validate release, package eligibility, and merged source
        id: selection
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if ($env:WORKFLOW_REF -cne 'refs/heads/main') {
            throw 'NuGet publication must be dispatched from the reviewed main branch.'
          }
          Import-Module ./eng/NuGetRelease.psm1 -Force
          $environmentOutput = & gh api "repos/$($env:RELEASE_REPOSITORY)/environments/nuget.org" 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the existing nuget.org environment; refusing to create or bypass it: $($environmentOutput -join "`n")"
          }
          $environment = ($environmentOutput -join "`n") | ConvertFrom-Json
          $branchPolicyOutput = & gh api "repos/$($env:RELEASE_REPOSITORY)/environments/nuget.org/deployment-branch-policies" 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read nuget.org deployment branch protections: $($branchPolicyOutput -join "`n")"
          }
          $branchPolicies = ($branchPolicyOutput -join "`n") | ConvertFrom-Json
          Assert-NuGetEnvironmentProtection -Environment $environment -BranchPolicies $branchPolicies
          "environment_ready=true" >> $env:GITHUB_OUTPUT
          Import-Module ./eng/PluginRelease.psm1 -Force
          $selection = (./eng/Resolve-ReleaseSelection.ps1 -Tag $env:RELEASE_TAG | ConvertFrom-Json)[0]
          $component = @(Get-PluginRegistry | Where-Object key -CEQ $selection.key)[0]
          if ($component.artifactFormat -cne 'nupkg') {
            throw "$($component.key) produces '$($component.artifactFormat)' artifacts; NuGet publication is not supported."
          }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the reviewed main branch.' }
          $tagCommit = (git rev-parse "$($env:RELEASE_TAG)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Release tag '$($env:RELEASE_TAG)' does not resolve to a commit." }
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The release tag must point to a commit already reachable from main.' }
          $releaseOutput = & gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --json isDraft,assets 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Could not read the GitHub Release: $($releaseOutput -join "`n")" }
          $release = ($releaseOutput -join "`n") | ConvertFrom-Json
          if ($release.isDraft) { throw 'NuGet publication requires an already-published GitHub Release.' }
          $packageAsset = "$($component.packageId).$($selection.version).nupkg"
          $expectedAssets = @($packageAsset, "$packageAsset.sha256", 'release-manifest.json')
          $actualAssets = @($release.assets | ForEach-Object name)
          if ($actualAssets.Count -ne 3 -or @(Compare-Object $expectedAssets $actualAssets).Count -gt 0) {
            throw "The published GitHub Release does not contain exactly the expected package, checksum, and manifest assets."
          }
          "plugin=$($component.key)" >> $env:GITHUB_OUTPUT
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "package_asset=$packageAsset" >> $env:GITHUB_OUTPUT

  publish:
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.environment_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: nuget.org
    concurrency:
      group: nuget-publish-${{ needs.plan.outputs.plugin }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.tag }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Download the exact published GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          PACKAGE_ASSET: ${{ needs.plan.outputs.package_asset }}
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/nuget-release
        run: |
          New-Item -ItemType Directory -Path $env:ARTIFACT_DIRECTORY | Out-Null
          & gh release download $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --dir $env:ARTIFACT_DIRECTORY --pattern $env:PACKAGE_ASSET --pattern "$($env:PACKAGE_ASSET).sha256" --pattern release-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the published GitHub Release assets.' }
      - name: Publish verified GitHub package to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_PLUGIN: ${{ needs.plan.outputs.plugin }}
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/nuget-release
        run: ./eng/Publish-NuGetPackage.ps1 -Plugin $env:RELEASE_PLUGIN -Tag $env:RELEASE_TAG -ArtifactDirectory $env:ARTIFACT_DIRECTORY -Publish
