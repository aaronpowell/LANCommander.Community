name: Build and publish one plugin

on:
  workflow_call:
    inputs:
      plugin:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      nuget_api_key:
        required: false

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ inputs.plugin }}
  cancel-in-progress: false

jobs:
  nuget-key:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check optional NuGet.org key presence
        id: check
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.nuget_api_key }}
        run: |
          if [[ -n "${NUGET_API_KEY:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: nuget-key
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.destinations.outputs.artifact_name }}
      artifact_format: ${{ steps.destinations.outputs.artifact_format }}
      github_packages_eligible: ${{ steps.destinations.outputs.github_packages_eligible }}
      nuget_org_eligible: ${{ steps.destinations.outputs.nuget_org_eligible }}
      nuget_api_key_available: ${{ needs.nuget-key.outputs.available }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - if: inputs.plugin == 'Server.Mcp'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - if: inputs.plugin == 'Launcher.MQTT'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - if: inputs.plugin == 'Launcher.MQTT'
        run: python -m pip install -r plugins/Launcher.MQTT/tests/ha-template-requirements.txt
      - name: Validate and package the selected component
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PLUGIN: ${{ inputs.plugin }}
        run: |
          $selection = (./eng/Resolve-ReleaseSelection.ps1 -Tag $env:RELEASE_TAG | ConvertFrom-Json)[0]
          if ($selection.key -cne $env:RELEASE_PLUGIN) { throw 'Release tag selected a different component.' }
          ./eng/Validate-Plugin.ps1 -Plugin $env:RELEASE_PLUGIN -OutputDirectory (Join-Path $env:RUNNER_TEMP 'plugin-release')
      - name: Select package feed destinations
        id: destinations
        shell: pwsh
        env:
          RELEASE_PLUGIN: ${{ inputs.plugin }}
          RELEASE_ARTIFACT_NAME: plugin-release-${{ inputs.plugin }}-${{ github.run_id }}-${{ github.run_attempt }}
          NUGET_API_KEY_AVAILABLE: ${{ needs.nuget-key.outputs.available }}
        run: |
          Import-Module ./eng/ReleaseDestinations.psm1 -Force
          $plan = Get-ReleaseDestinationPlan -Plugin $env:RELEASE_PLUGIN -NuGetApiKeyAvailable ($env:NUGET_API_KEY_AVAILABLE -eq 'true')
          "artifact_name=$env:RELEASE_ARTIFACT_NAME" >> $env:GITHUB_OUTPUT
          "artifact_format=$($plan.artifactFormat)" >> $env:GITHUB_OUTPUT
          "github_packages_eligible=$($plan.githubPackagesEligible.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "nuget_org_eligible=$($plan.nugetOrgEligible.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($plan.nugetOrgSkipReason) { Write-Output $plan.nugetOrgSkipReason }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.destinations.outputs.artifact_name }}
          path: ${{ runner.temp }}/plugin-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/plugin-release
      - name: Verify and publish the exact checked artifact bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PLUGIN: ${{ inputs.plugin }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: ./eng/Publish-Release.ps1 -Plugin $env:RELEASE_PLUGIN -Tag $env:RELEASE_TAG -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'plugin-release') -Repository $env:RELEASE_REPOSITORY

  publish-github-packages:
    needs: [build, publish]
    if: needs.build.outputs.github_packages_eligible == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: github-packages-${{ inputs.plugin }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/plugin-release
      - name: Publish or verify the exact package bytes on GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTIONS: 'true'
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PLUGIN: ${{ inputs.plugin }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: ./eng/Publish-GitHubPackage.ps1 -Plugin $env:RELEASE_PLUGIN -Tag $env:RELEASE_TAG -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'plugin-release') -Owner $env:GITHUB_REPOSITORY_OWNER -Repository $env:RELEASE_REPOSITORY -Publish

  publish-nuget-org:
    needs: [build, publish]
    if: needs.build.outputs.nuget_org_eligible == 'true' && needs.build.outputs.nuget_api_key_available == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: nuget-org-${{ inputs.plugin }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/plugin-release
      - name: Publish or verify the exact package bytes on NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.nuget_api_key }}
          GITHUB_ACTIONS: 'true'
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PLUGIN: ${{ inputs.plugin }}
        run: ./eng/Publish-NuGetPackage.ps1 -Plugin $env:RELEASE_PLUGIN -Tag $env:RELEASE_TAG -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'plugin-release') -Publish

  nuget-org-skipped:
    needs: [build, publish]
    if: needs.build.outputs.nuget_org_eligible == 'true' && needs.build.outputs.nuget_api_key_available != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report intentional NuGet.org skip
        run: echo "NuGet.org publication was intentionally skipped because the NUGET_API_KEY repository secret is not configured."

  nuget-org-not-eligible:
    needs: [build, publish]
    if: needs.build.outputs.nuget_org_eligible != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report unsupported artifact format
        env:
          RELEASE_PLUGIN: ${{ inputs.plugin }}
          ARTIFACT_FORMAT: ${{ needs.build.outputs.artifact_format }}
        run: echo "$RELEASE_PLUGIN produces $ARTIFACT_FORMAT and is not published to NuGet.org."
