name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Validate release selection and repository metadata
        shell: pwsh
        run: |
          ./eng/Test-ReleaseSelection.ps1
          ./eng/Test-Repository.ps1

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [Server.Mcp, Server.RecompCatalog, Launcher.MQTT]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - if: matrix.plugin == 'Server.Mcp'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - if: matrix.plugin == 'Launcher.MQTT'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - if: matrix.plugin == 'Launcher.MQTT'
        run: python -m pip install -r plugins/Launcher.MQTT/tests/ha-template-requirements.txt
      - name: Validate ${{ matrix.plugin }}
        shell: pwsh
        run: ./eng/Validate-Plugin.ps1 -Plugin '${{ matrix.plugin }}' -OutputDirectory (Join-Path $env:RUNNER_TEMP 'community-plugin-artifacts')
